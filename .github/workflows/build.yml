name: Build WPF Application

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build application
        run: msbuild CourseWork_Zubarev.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlagiarismDetectionSystem
          path: |
            **/bin/Release/*.exe
            **/bin/Release/*.dll


name: Build WPF Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find project
        id: project
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Recurse -File |
            Where-Object { $_.Extension -in ".sln", ".slnx" } |
            Select-Object -First 1

          if ($solution) {
            $projectPath = $solution.FullName
          }
          else {
            $project = Get-ChildItem -Path . -Filter *.csproj -Recurse -File |
              Select-Object -First 1

            if (-not $project) {
              Write-Error "Не найден файл .sln, .slnx или .csproj"
              exit 1
            }

            $projectPath = $project.FullName
          }

          Write-Host "Найден проект: $projectPath"
          "path=$projectPath" >> $env:GITHUB_OUTPUT

      - name: Build application
        shell: pwsh
        run: |
          msbuild "${{ steps.project.outputs.path }}" /p:Configuration=Release

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: PlagiarismDetectionSystem
          path: |
            **/bin/Release/*.exe
            **/bin/Release/*.dll
            **/bin/Release/*.config
          if-no-files-found: error

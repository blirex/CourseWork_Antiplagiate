
name: Build WPF Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find solution
        id: solution
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1

          if (-not $solution) {
            Write-Error "Solution file (.sln) not found"
            exit 1
          }

          Write-Host "Found: $($solution.FullName)"
          "path=$($solution.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build application
        shell: pwsh
        run: |
          msbuild "${{ steps.solution.outputs.path }}" /p:Configuration=Release "/p:Platform=Any CPU"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlagiarismDetectionSystem
          path: |
            **/bin/Release/*.exe
            **/bin/Release/*.dll
          if-no-files-found: error
